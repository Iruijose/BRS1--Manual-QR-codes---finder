<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRS1 Manual Staking QR Finder</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --border: #dfe1e6;
    --border-light: #ebecf0;
    --text: #172b4d;
    --text-secondary: #44546f;
    --text-muted: #8993a4;
    --primary: #0052CC;
    --primary-dark: #0747A6;
    --success: #36b37e;
    --radius-md: 10px;
    --radius-sm: 6px;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-mono: 'SF Mono', Consolas, 'Courier New', monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 28px; }
  header h1 { font-size: 24px; margin: 0 0 6px; font-weight: 700; }
  header p { color: var(--text-secondary); font-size: 14px; margin: 0; }

  .search-box {
    position: relative;
    margin-bottom: 20px;
  }
  .search-box input {
    width: 100%;
    padding: 14px 44px 14px 16px;
    font-size: 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .search-box input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(0,82,204,0.12);
  }
  .search-box .icon {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 18px;
    pointer-events: none;
  }

  .meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--text-muted);
    font-size: 13px;
    margin-bottom: 14px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-md);
    padding: 16px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
  }
  .card:hover {
    border-color: var(--primary);
    box-shadow: 0 4px 14px rgba(23,43,77,0.08);
    transform: translateY(-2px);
  }
  .card img {
    width: 100%;
    max-width: 150px;
    aspect-ratio: 1 / 1;
    object-fit: contain;
    background: #fff;
    border-radius: var(--radius-sm);
    margin-bottom: 10px;
  }
  .card .name {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    word-break: break-word;
    color: var(--text);
  }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  .empty .big { font-size: 40px; margin-bottom: 10px; }

  /* Modal */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(9,30,66,0.54);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .modal-backdrop.active { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: var(--radius-md);
    padding: 28px;
    max-width: 360px;
    width: 100%;
    text-align: center;
    position: relative;
  }
  .modal img {
    width: 100%;
    max-width: 260px;
    aspect-ratio: 1/1;
    object-fit: contain;
    margin: 0 auto 16px;
    display: block;
  }
  .modal .name {
    font-family: var(--font-mono);
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .modal .logged {
    font-size: 12px;
    color: var(--success);
    margin-top: 10px;
  }
  .modal .close-btn {
    position: absolute;
    top: 10px;
    right: 14px;
    background: none;
    border: none;
    font-size: 20px;
    color: var(--text-muted);
    cursor: pointer;
    line-height: 1;
  }
  .modal .close-btn:hover { color: var(--text); }
  .modal .download-btn {
    display: inline-block;
    margin-top: 14px;
    padding: 10px 18px;
    background: var(--primary);
    color: #fff;
    border-radius: var(--radius-sm);
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
  }
  .modal .download-btn:hover { background: var(--primary-dark); }

  footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    margin-top: 40px;
  }
  footer a { color: var(--primary); text-decoration: none; }

  @media (prefers-reduced-motion: no-preference) {
    .fade-in { animation: fadeIn 0.3s ease-out both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>BRS1 Manual Staking QR Finder</h1>
    <p>Search by sort / filter name to find its QR code</p>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search e.g. DBN5-ND, DCF2-SD, Exeter..." autocomplete="off">
    <span class="icon">&#128269;</span>
  </div>

  <div class="meta-row">
    <span id="resultCount"></span>
    <span id="lastLookup"></span>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyState" style="display:none;">
    <div class="big">&#128269;</div>
    <div>No matching sort/filter found</div>
  </div>

  <footer>
    BRS1 &middot; Manual Staking Filters &middot; <span id="totalCount"></span> QR codes indexed
  </footer>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <button class="close-btn" id="closeModal">&times;</button>
    <img id="modalImg" src="" alt="">
    <div class="name" id="modalName"></div>
    <div class="logged" id="modalLogged"></div>
    <a class="download-btn" id="modalDownload" download>Download QR Image</a>
  </div>
</div>

<script>
var ALL_DATA = [{"name": "DBN5 - ND", "image": "images/dbn5-nd.png"}, {"name": "DBS3-SD", "image": "images/dbs3-sd.png"}, {"name": "DEX2-SD", "image": "images/dex2-sd.png"}, {"name": "DME4-ND", "image": "images/dme4-nd.png"}, {"name": "DRH2-ND", "image": "images/drh2-nd.png"}, {"name": "Bristol-H1-3D-FT", "image": "images/bristol-h1-3d-ft.png"}, {"name": "DBR1-ND", "image": "images/dbr1-nd.png"}, {"name": "DCF2-SD", "image": "images/dcf2-sd.png"}, {"name": "DNN1-ND", "image": "images/dnn1-nd.png"}, {"name": "DRM4-ND", "image": "images/drm4-nd.png"}, {"name": "DSA1-SD", "image": "images/dsa1-sd.png"}, {"name": "DWR2-SD", "image": "images/dwr2-sd.png"}, {"name": "DXP1-SD", "image": "images/dxp1-sd.png"}, {"name": "DXW3-ND", "image": "images/dxw3-nd.png"}, {"name": "DPE2-ND", "image": "images/dpe2-nd.png"}, {"name": "LBA8", "image": "images/lba8.png"}, {"name": "DSO2-SD", "image": "images/dso2-sd.png"}, {"name": "SXW2-MIX", "image": "images/sxw2-mix.png"}, {"name": "RM-BRISTOL-H1", "image": "images/rm-bristol-h1.png"}, {"name": "DBS3-ND", "image": "images/dbs3-nd.png"}, {"name": "MANUALSORT_9", "image": "images/manualsort-9.png"}, {"name": "DBH3-ND", "image": "images/dbh3-nd.png"}, {"name": "DCR3-ND", "image": "images/dcr3-nd.png"}, {"name": "DEX2-ND", "image": "images/dex2-nd.png"}, {"name": "DHA2-ND", "image": "images/dha2-nd.png"}, {"name": "DPO1-ND", "image": "images/dpo1-nd.png"}, {"name": "DST1-ND", "image": "images/dst1-nd.png"}, {"name": "DWR2-ND", "image": "images/dwr2-nd.png"}, {"name": "DXN1-ND", "image": "images/dxn1-nd.png"}, {"name": "MAN8-DPR1", "image": "images/man8-dpr1.png"}, {"name": "DXG2-ND", "image": "images/dxg2-nd.png"}, {"name": "DPD-BURBAGE", "image": "images/dpd-burbage.png"}, {"name": "DCF2-ND", "image": "images/dcf2-nd.png"}, {"name": "DHA1-ND", "image": "images/dha1-nd.png"}, {"name": "DSA1-ND", "image": "images/dsa1-nd.png"}, {"name": "RM-NORTHAMPTON", "image": "images/rm-northampton.png"}, {"name": "DBS2-ND", "image": "images/dbs2-nd.png"}, {"name": "DOX2-ND", "image": "images/dox2-nd.png"}, {"name": "DRG3-ND", "image": "images/drg3-nd.png"}, {"name": "DRR1-ND", "image": "images/drr1-nd.png"}, {"name": "DWN2-ND", "image": "images/dwn2-nd.png"}, {"name": "DBI2-ND", "image": "images/dbi2-nd.png"}, {"name": "DLU2-ND", "image": "images/dlu2-nd.png"}, {"name": "DPR1-ND", "image": "images/dpr1-nd.png"}, {"name": "DRG2-ND", "image": "images/drg2-nd.png"}, {"name": "DSN1-ND", "image": "images/dsn1-nd.png"}, {"name": "DWR1-MR", "image": "images/dwr1-mr.png"}, {"name": "DXP1-ND", "image": "images/dxp1-nd.png"}, {"name": "DRM5-MR", "image": "images/drm5-mr.png"}, {"name": "RM-SWANSEA", "image": "images/rm-swansea.png"}, {"name": "EXETER", "image": "images/exeter.png"}, {"name": "RM-PLYMOUTH", "image": "images/rm-plymouth.png"}];
var grid, emptyState, searchInput, resultCount, totalCount, lastLookup;
var modalBackdrop, modalImg, modalName, modalLogged, modalDownload, closeModal;

function logLookup(name) {
  try {
    var key = "brs1_qr_lookup_log";
    var log = JSON.parse(localStorage.getItem(key) || "[]");
    log.push({ name: name, at: new Date().toISOString() });
    if (log.length > 500) log = log.slice(log.length - 500);
    localStorage.setItem(key, JSON.stringify(log));
    return log;
  } catch (e) {
    return [];
  }
}

function getLastLookup() {
  try {
    var log = JSON.parse(localStorage.getItem("brs1_qr_lookup_log") || "[]");
    if (log.length === 0) return null;
    return log[log.length - 1];
  } catch (e) {
    return null;
  }
}

function renderGrid(items) {
  grid.innerHTML = "";
  if (items.length === 0) {
    emptyState.style.display = "block";
    grid.style.display = "none";
  } else {
    emptyState.style.display = "none";
    grid.style.display = "grid";
    for (var i = 0; i < items.length; i++) {
      var item = items[i];
      var card = document.createElement("div");
      card.className = "card fade-in";
      card.setAttribute("data-name", item.name);
      card.setAttribute("data-image", item.image);

      var img = document.createElement("img");
      img.src = item.image;
      img.alt = item.name;
      card.appendChild(img);

      var nameDiv = document.createElement("div");
      nameDiv.className = "name";
      nameDiv.textContent = item.name;
      card.appendChild(nameDiv);

      grid.appendChild(card);
    }
  }
  resultCount.textContent = items.length + " of " + ALL_DATA.length + " shown";
}

function openModal(name, image) {
  modalImg.src = image;
  modalImg.alt = name;
  modalName.textContent = name;
  modalDownload.href = image;
  modalDownload.setAttribute("download", name + ".png");
  logLookup(name);
  modalLogged.textContent = "Lookup logged on this device";
  modalBackdrop.classList.add("active");
  updateLastLookup();
}

function closeModalFn() {
  modalBackdrop.classList.remove("active");
}

function updateLastLookup() {
  var last = getLastLookup();
  if (last) {
    var d = new Date(last.at);
    lastLookup.textContent = "Last lookup: " + last.name + " (" + d.toLocaleString() + ")";
  } else {
    lastLookup.textContent = "";
  }
}

function filterData(query) {
  var q = query.trim().toLowerCase();
  if (q === "") return ALL_DATA;
  return ALL_DATA.filter(function(item) {
    return item.name.toLowerCase().indexOf(q) !== -1;
  });
}

function handleSearchInput() {
  var items = filterData(searchInput.value);
  renderGrid(items);
}

function handleGridClick(e) {
  var card = e.target.closest(".card");
  if (!card) return;
  openModal(card.getAttribute("data-name"), card.getAttribute("data-image"));
}

grid = document.getElementById("grid");
emptyState = document.getElementById("emptyState");
searchInput = document.getElementById("searchInput");
resultCount = document.getElementById("resultCount");
totalCount = document.getElementById("totalCount");
lastLookup = document.getElementById("lastLookup");
modalBackdrop = document.getElementById("modalBackdrop");
modalImg = document.getElementById("modalImg");
modalName = document.getElementById("modalName");
modalLogged = document.getElementById("modalLogged");
modalDownload = document.getElementById("modalDownload");
closeModal = document.getElementById("closeModal");

totalCount.textContent = ALL_DATA.length;
renderGrid(ALL_DATA);
updateLastLookup();

searchInput.addEventListener("input", handleSearchInput);
grid.addEventListener("click", handleGridClick);
closeModal.addEventListener("click", closeModalFn);
modalBackdrop.addEventListener("click", function(e) {
  if (e.target === modalBackdrop) closeModalFn();
});
document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") closeModalFn();
});
</script>
</body>
</html>
